services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aibah
      POSTGRES_PASSWORD: aibah
      POSTGRES_DB: aibah
    ports:
      - "127.0.0.1:5432:5432" # host-side access: npm run dev / prisma studio
    volumes:
      - aibah_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibah -d aibah"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://aibah:aibah@db:5432/aibah?schema=public
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  studio:
    build: .
    restart: unless-stopped
    command: ["npx", "prisma", "studio", "--port", "5555", "--hostname", "0.0.0.0"]
    environment:
      DATABASE_URL: postgresql://aibah:aibah@db:5432/aibah?schema=public
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      db:
        condition: service_healthy

volumes:
  aibah_pgdata: